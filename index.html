    body{background:#000;color:#fff;font-family:Arial,sans-serif;}
    #root{height:100vh;display:flex;flex-direction:column;overflow:hidden;width:100%;font-size:calc(var(--app-scale, 1) * 16px);}
    #loading{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;
      align-items:center;justify-content:center;z-index:9999;gap:20px;}
    .progress-bar{width:220px;height:6px;background:#222;border-radius:3px;overflow:hidden;}
    .progress-fill{height:100%;background:#FFD700;border-radius:3px;transition:width 0.3s ease;width:0%;}
    .progress-text{color:#666;font-size:12px;}
    .scrollable{overflow-y:scroll!important;-webkit-overflow-scrolling:touch!important;overscroll-behavior:contain;}
    .scroll-list{overflow-y:auto!important;-webkit-overflow-scrolling:touch!important;flex:1 1 0!important;min-height:0!important;}
  </style>
