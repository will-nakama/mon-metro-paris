    .progress-fill{height:100%;background:#FFD700;border-radius:3px;transition:width 0.3s ease;width:0%;}
    .progress-text{color:#666;font-size:12px;}
    .scrollable{overflow-y:scroll!important;-webkit-overflow-scrolling:touch!important;overscroll-behavior:contain;}

      const lists = document.querySelectorAll('.scroll-list');
      let best = null, bestScore = 0;
      for (let i = 0; i < lists.length; i++) {
        const el = lists[i];
        const sh = el.scrollHeight;
        const ch = el.clientHeight;
        if (sh <= ch + 30) continue;
        const rect = el.getBoundingClientRect();
        if (rect.width < 100 || rect.height < 200) continue;
        if (rect.bottom < 50 || rect.top > window.innerHeight - 50) continue;
        const score = rect.width * rect.height;
        if (score > bestScore) { best = el; bestScore = score; }
      }
      return best;
    }

      const cont = findMainScrollable();

      const sh = cont.scrollHeight;
      const ch = cont.clientHeight;
      const canDown = st + ch < sh - 30;
      const canUp = st > 30;

      clearInterval(interval);
